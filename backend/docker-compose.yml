version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: fixitworld
      POSTGRES_PASSWORD: fixitworld_dev_password
      POSTGRES_DB: fixitworld
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .
    environment:
      DATABASE_URL: postgresql://fixitworld:fixitworld_dev_password@postgres:5432/fixitworld
      JWT_SECRET: dev-secret-key
      NODE_ENV: development
      PORT: 5000
    ports:
      - "5000:5000"
    depends_on:
      - postgres
    volumes:
      - .:/app
      - /app/node_modules

volumes:
  postgres_data:
